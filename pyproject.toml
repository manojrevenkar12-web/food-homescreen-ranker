[project]
name = "food-homescreen-ranker"
version = "1.0.0"
description = "Home screen ranking for food delivery: retrieval, learning-to-rank, cold start and whole-page assembly"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "duckdb>=1.0", "lightgbm>=4.3", "scikit-learn>=1.4", "torch>=2.2",
  "fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
spark = ["pyspark>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fhr = ["features/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = ["spark: needs pyspark and Java"]
addopts = "-m 'not spark'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/gate.py" = ["E501"]
"scripts/report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fhr"]
known-local-folder = ["_common"]
